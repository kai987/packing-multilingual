[package]
name = "packing-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
indexmap = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
